name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: TypeScript typecheck + ESLint — always runs
  # ---------------------------------------------------------------------------
  lint-type:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    outputs:
      has_supabase: ${{ steps.check-secret.outputs.has_supabase }}

    steps:
      - name: Check Supabase Secret
        id: check-secret
        env:
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SERVICE_ROLE" ]; then
            echo "has_supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_supabase=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Job 2: Unit / static tests — always runs (no Supabase needed)
  # Excludes integration test files that import supabase-test-client.
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  # ---------------------------------------------------------------------------
  # Job 3: Production Build — validates build integrity independently
  # ---------------------------------------------------------------------------
  build:
    name: Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          MARKETPLACE_NAME: 'velvet.'
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-for-ci-build

  # ---------------------------------------------------------------------------
  # Job 4: Integration Tests — executes only when secure Supabase environment is configured
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration Tests (Live Supabase)
    runs-on: ubuntu-latest
    needs: [lint-type, test-unit, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.lint-type.outputs.has_supabase == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANALYTICS_RATE_LIMIT_SECRET: ${{ secrets.ANALYTICS_RATE_LIMIT_SECRET }}
          MARKETPLACE_NAME: 'velvet.'
