name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # CI builds use placeholder values — no real Supabase required.
          # The build must succeed without real env vars (health endpoint
          # and home page are static/server-rendered without DB calls).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-for-ci-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
